# Boilerplate template metadata
# This template extends `project` to add Streamlit-specific scaffolding.
# Questions and defaults from `project` are inherited; this layer overrides
# the `dependencies` default to include streamlit and pydantic and turns the
# base layer's sample module off.

schema_version: "1"       # Boilerplate metadata schema version

name: streamlit            # Template identifier (used in `boilerplate new streamlit`)
version: 0.2.0             # SemVer — one bump per release, the smallest step the unreleased changes need
description: A Streamlit app, built on the general-purpose template.

extends:                   # Composition: this template layers on top of `project`.
  - project                # The `project` template renders first, then `streamlit`
                           # overrides/adds files on top. Questions are merged.
