_answers_file: .copier-answers.streamlit.yml

# Copier's default exclusions, restated because a declared `_exclude` replaces
# them, plus Boilerplate's own authoring metadata.
_exclude:
  - "/copier.yaml"
  - "/copier.yml"
  - "/boilerplate.yml"
  - "~*"
  - "*.py[co]"
  - __pycache__
  - .git
  - .DS_Store
  - .svn

_jinja_extensions:
  - boilerplate.templates._jinja_extensions.slugify:SlugifyExtension
  - copier_template_extensions.TemplateExtensionLoader

# Every answer this layer's files and paths use is declared here, including
# the ones `project` also asks. `extends` merges questions at compose time
# only; a per-layer `copier update` renders from this file alone (see
# docs/design/adr-015-idiomatic-artifacts.md, point 4).
project_name:
  type: str
  help: "What is the (human-readable) name of the project? (e.g. My Project)"
  default: "{{ _folder_name }}"

project_slug:
  default: "{{ project_name | slugify }}"
  when: false

package_name:
  default: "{{ project_slug | replace('-', '_') }}"
  when: false

description:
  type: str
  help: "What is a brief description of the project?"
  default: "A new Python project."

author_name:
  type: str
  help: "Your first and last name?"
  default: "Your Name"

author_email:
  type: str
  help: "Your email address?"
  default: "username@domain.com"

package_index_url:
  type: str
  help: "Package index URL for the project's default uv index (leave empty for public PyPI; no index block is emitted)."
  default: ""

dependencies:
  default: ["streamlit", "pydantic>=2"]

sample_module:
  default: false

container_registry:
  type: str
  help: "Container registry hostname for image pushes (e.g. ghcr.io or registry.example.com)."
  default: "ghcr.io"

# The previous release rendered the smoke test as tests_app.py. Copier's update
# removes paths the new version stops rendering without checking whether the
# project changed them, so this before-stage migration moves the project's copy
# to the new name with `git mv`; the update then surfaces it as a conflict that
# carries both versions instead of deleting it (docs/design/adr-007-update-model.md).
# No `version` gate: bundled layers share the repository's tag stream, so the
# migration runs on every update and is a no-op once the old name is gone.
_migrations:
  - when: "{{ _stage == 'before' }}"
    command:
      - "{{ _copier_python }}"
      - -c
      - |
        import pathlib
        import subprocess

        for old in pathlib.Path("tests/integration").glob("*/tests_app.py"):
            new = old.with_name("test_app.py")
            if not new.exists():
                subprocess.run(["git", "mv", str(old), str(new)], check=True)
