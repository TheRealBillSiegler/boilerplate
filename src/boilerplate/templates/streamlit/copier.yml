_answers_file: .copier-answers.streamlit.yml

# Copier's default exclusions, restated because a declared `_exclude` replaces
# them, plus Boilerplate's own authoring metadata.
_exclude:
  - "/copier.yaml"
  - "/copier.yml"
  - "/boilerplate.yml"
  - "~*"
  - "*.py[co]"
  - __pycache__
  - .git
  - .DS_Store
  - .svn

_jinja_extensions:
  - copier_template_extensions.TemplateExtensionLoader

# Project-owned: the project is expected to rewrite and keep these, so a
# release never merges into them again once they exist. Deleting one brings
# it back on the next update (Copier still recreates a deleted
# `_skip_if_exists` file). The smoke test is listed with the app it tests,
# since a project that rewrites its app owns the test of that app. The demo's
# models, services, and adapters (and their unit tests) stay template-owned
# instead: the README's "Make it yours" has the project swap their contents in
# place, but they remain scaffolding the template may keep restructuring, so
# edits there accept the normal template-owned risk of a conflict on the next
# release.
_skip_if_exists:
  - "README.md"
  - "src/{{ package_name }}/app.py"
  - "tests/integration/{{ package_name }}/test_app.py"

# This layer's own questions and its overrides of `project`'s defaults. Every
# other answer its files use comes from `project` through composition
# (docs/design/04-composition-engine.md, Configuration Merger).
dependencies:
  default: ["streamlit", "pydantic>=2"]

sample_module:
  default: false

container_registry:
  type: str
  help: "Container registry hostname for image pushes (e.g. ghcr.io or registry.example.com)"
  default: "ghcr.io"

# The previous release rendered the smoke test as tests_app.py. Copier's update
# removes paths the new version stops rendering without checking whether the
# project changed them, so this before-stage migration moves the project's copy
# to the new name with `git mv`; the update then surfaces it as a conflict that
# carries both versions instead of deleting it (docs/design/adr-007-update-model.md).
# No `version` gate: bundled layers share the repository's tag stream, so the
# migration runs on every update and is a no-op once the old name is gone.
_migrations:
  - when: "{{ _stage == 'before' }}"
    command:
      - "{{ _copier_python }}"
      - -c
      - |
        import pathlib
        import subprocess

        for old in pathlib.Path("tests/integration").glob("*/tests_app.py"):
            new = old.with_name("test_app.py")
            if not new.exists():
                subprocess.run(["git", "mv", str(old), str(new)], check=True)
