_templates_suffix: .jinja

_answers_file: .copier-answers.project.yml

# A declared `_exclude` replaces Copier's defaults rather than extending them,
# so they are restated here; without them a vanilla `copier update` from a
# git-backed clone copies the clone's `.git` over the project's own.
# `boilerplate.yml` is Boilerplate's authoring metadata, never rendered.
_exclude:
  - "/copier.yaml"
  - "/copier.yml"
  - "/boilerplate.yml"
  - "~*"
  - "*.py[co]"
  - __pycache__
  - .git
  - .DS_Store
  - .svn
  - _extensions

_jinja_extensions:
  - boilerplate.templates._jinja_extensions.slugify:SlugifyExtension
  - copier_template_extensions.TemplateExtensionLoader
  - _extensions/context.py:ContextUpdater

# Project-owned: the project is expected to rewrite and keep these, so a
# release never merges into them again once they exist. Deleting one brings
# it back on the next update (Copier still recreates a deleted
# `_skip_if_exists` file), which is why a file meant to be deleted instead
# (module.py) is not listed here.
_skip_if_exists:
  - "README.md"
  - "src/{{ package_name }}/__init__.py"

# description, author_name and author_email land inside double-quoted TOML
# strings in pyproject.toml. project_name and description land inside Python
# docstrings, and project_name also inside the string literals of the
# Streamlit template's app. A double quote, a backslash or a line break can
# end or escape those strings, so the four validators refuse all three.
project_name:
  type: str
  help: "The (human-readable) name of the project (e.g. My Project)"
  default: "{{ _folder_name }}"
  # The package name is derived the same way as package_name below; a
  # validator cannot see a computed answer. Copier validates the default too,
  # so a folder name that fails stops the render before the first prompt,
  # which is why the message names the way out.
  validator: >-
    {%- set package = project_name | slugify | replace('-', '_') -%}
    {%- if '"' in project_name or '\\' in project_name or '\n' in project_name or '\r' in project_name -%}
    Leave out double quotes, backslashes and line breaks.
    {%- elif not package.isidentifier() or package in ['and', 'as', 'assert', 'async', 'await', 'break', 'class', 'continue', 'def', 'del', 'elif', 'else', 'except', 'finally', 'for', 'from', 'global', 'if', 'import', 'in', 'is', 'lambda', 'nonlocal', 'not', 'or', 'pass', 'raise', 'return', 'try', 'while', 'with', 'yield'] -%}
    This name makes the package "{{ package }}", which Python can't import. Use a name that starts with a letter and isn't a Python keyword, such as "Analysis 2024". The name defaults to the folder's, so rename the folder or pass --data project_name="Analysis 2024".
    {%- endif -%}

project_slug:
  default: "{{ project_name | slugify }}"
  when: false

package_name:
  default: "{{ project_slug | replace('-', '_') }}"
  when: false

description:
  type: str
  help: "A brief description of the project"
  default: "A new Python project."
  validator: >-
    {%- if '"' in description or '\\' in description or '\n' in description or '\r' in description -%}
    Leave out double quotes, backslashes and line breaks.
    {%- endif -%}

dependencies:
  type: json
  default: []
  help: "Main runtime dependencies for the base project"

dev_dependencies:
  type: json
  default:
    - ipykernel
    - pyright
    - pytest
    - pytest-cov
    - pytest-mock
    - ruff
  help: "Main development dependencies"

sample_module:
  type: bool
  help: "Whether to include the sample module and its test (module.py, test_module.py) as a starting point"
  default: true

author_name:
  type: str
  help: "Your first and last name"
  default: "Your Name"
  validator: >-
    {%- if '"' in author_name or '\\' in author_name or '\n' in author_name or '\r' in author_name -%}
    Leave out double quotes, backslashes and line breaks.
    {%- endif -%}

author_email:
  type: str
  help: "Your email address"
  default: "username@domain.com"
  validator: >-
    {%- if '"' in author_email or '\\' in author_email or '\n' in author_email or '\r' in author_email -%}
    Leave out double quotes, backslashes and line breaks.
    {%- endif -%}

build_backend:
  type: str
  help: "Build backend that turns the project into a wheel and an sdist"
  default: uv_build
  choices:
    "uv_build: uv's own backend, for pure-Python code with a static version": uv_build
    "hatchling: build hooks, plugins, a version from git tags, or a custom file layout": hatchling

package_index_url:
  type: str
  help: "Package index URL for the project's default uv index (leave empty for public PyPI; no index block is emitted)"
  default: ""

# A project rendered before `build_backend` existed has no such answer, and
# `copier update --defaults` would give it the question's default and move it
# from hatchling to uv_build. The migration records the backend that project
# was built with; it leaves a recorded answer alone. No `version` gate: bundled
# layers share the repository's tag stream, so a version gate would skip a
# project rendered at the tag that precedes this change, and the key check
# makes the migration a no-op once the answer exists.
_migrations:
  - when: "{{ _stage == 'before' }}"
    command:
      - "{{ _copier_python }}"
      - -c
      - |
        import pathlib
        import sys

        answers = pathlib.Path(sys.argv[1])
        if answers.exists():
            text = answers.read_bytes()
            if b"\nbuild_backend:" not in b"\n" + text:
                answers.write_bytes(
                    text.rstrip(b"\r\n") + b"\nbuild_backend: hatchling\n"
                )
      - "{{ _copier_conf.answers_file }}"

# Creation-only: the script deletes its own `_scripts` folder once it has run,
# Copier treats that deletion as intentional and never restores the file, and
# an update runs every layer's tasks again, so an unguarded task would fail on
# every update.
_tasks:
  - command: ["{{ _copier_python }}", _scripts/post_generation.py]
    when: "{{ _copier_operation == 'copy' }}"
