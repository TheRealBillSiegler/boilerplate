_templates_suffix: .jinja

_answers_file: .copier-answers.project.yml

# A declared `_exclude` replaces Copier's defaults rather than extending them,
# so they are restated here; without them a vanilla `copier update` from a
# git-backed clone copies the clone's `.git` over the project's own.
# `boilerplate.yml` is Boilerplate's authoring metadata, never rendered.
_exclude:
  - "/copier.yaml"
  - "/copier.yml"
  - "/boilerplate.yml"
  - "~*"
  - "*.py[co]"
  - __pycache__
  - .git
  - .DS_Store
  - .svn
  - _extensions

_jinja_extensions:
  - boilerplate.templates._jinja_extensions.slugify:SlugifyExtension
  - copier_template_extensions.TemplateExtensionLoader
  - _extensions/context.py:ContextUpdater

project_name:
  type: str
  help: "What is the (human-readable) name of the project? (e.g. My Project)"
  default: "{{ _folder_name }}"

project_slug:
  default: "{{ project_name | slugify }}"
  when: false

package_name:
  default: "{{ project_slug | replace('-', '_') }}"
  when: false

description:
  type: str
  help: "What is a brief description of the project?"
  default: "A new Python project."

dependencies:
  type: json
  default: []
  help: "Main runtime dependencies for the base project"

dev_dependencies:
  type: json
  default:
    - ipykernel
    - pyright
    - pytest
    - pytest-cov
    - pytest-mock
    - ruff
  help: "Main development dependencies"

sample_module:
  type: bool
  help: "Include the sample module and its test (module.py, test_module.py) as a starting point?"
  default: true

author_name:
  type: str
  help: "Your first and last name?"
  default: "Your Name"

author_email:
  type: str
  help: "Your email address?"
  default: "username@domain.com"

package_index_url:
  type: str
  help: "Package index URL for the project's default uv index (leave empty for public PyPI; no index block is emitted)."
  default: ""

_tasks:
  -  ["{{ _copier_python }}", _scripts/post_generation.py]
