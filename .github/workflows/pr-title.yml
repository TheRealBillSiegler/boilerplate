name: PR title

# Pull requests squash-merge, so a PR's title becomes the subject of the one
# commit that lands on develop, and release-please reads that subject. This
# checks the title against AGENTS.md's Commits rules.
#
# It runs apart from ci.yml so that editing a title re-checks it without
# re-running CI: ci.yml leaves out the `edited` event on purpose, since every
# description edit would then start a billed run. The develop ruleset requires
# this job's check beside ci.yml's `check`. It watches develop only: main
# takes no pull requests, since a release fast-forwards it. Drafts are
# checked too, which costs one short Linux job per edit.

on:
  pull_request:
    branches: [develop]
    # `synchronize` too: a required check has to report on each new head.
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

# A newer title or push supersedes the check in flight.
concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv sync --frozen
      - name: Check the title
        env:
          # A runtime shell variable, never script source (avoids GitHub
          # Actions script injection, CWE-94 / CWE-78).
          TITLE: ${{ github.event.pull_request.title }}
        run: uv run python scripts/commit_lint.py --message "$TITLE"
