# Attaches the offline documentation bundle to each published GitHub Release.
#
# The `offline` mkdocs plugin makes the built site/ openable from file:// with no
# server; this packages it as boilerplate-docs-offline-<tag>.zip and uploads it
# as a release asset for air-gapped / offline distribution.
#
# Fires on `release: published` or manual dispatch. The dispatch path is the
# operative one for release-please releases: events created by the default
# GITHUB_TOKEN do not trigger downstream `release:` workflows, so after merging
# a release-please PR, run this manually against the new tag
# (`gh workflow run docs-offline-bundle.yml -f tag=vX.Y.Z`).
# `contents: write` is required and scoped to this release-only workflow solely
# to upload the asset (cf. ci.yml's read-only validation posture). Online docs
# are deployed separately via mike to GitHub Pages (see RELEASING.md).
name: Offline docs bundle

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach the bundle to (e.g. v0.3.0)"
        required: true
        type: string

permissions:
  contents: write # upload the bundle as a release asset (release events only)

jobs:
  bundle:
    name: Attach offline docs bundle
    runs-on: ubuntu-latest
    env:
      # Bind the (publisher-influenceable) release tag to an env var so it is a
      # runtime shell variable, never expanded into `run:` script source. This
      # avoids GitHub Actions script injection (CWE-94 / CWE-78). Always use the
      # quoted "$TAG" below, never ${{ github.event.* }} inside a run block.
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Validate release tag shape
        run: |
          [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] \
            || { echo "Unexpected release tag: $TAG" >&2; exit 1; }
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }} # build docs at the released tag
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv sync --frozen
      - name: Build docs (strict; offline-capable via the offline plugin)
        env:
          DOCS_OFFLINE: "true" # the offline plugin is env-gated; the online site builds without it
        run: uv run mkdocs build --strict
      - name: Package offline bundle
        run: |
          cd site
          zip -r "../boilerplate-docs-offline-${TAG}.zip" .
      - name: Attach bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" \
            "boilerplate-docs-offline-${TAG}.zip" --clobber
