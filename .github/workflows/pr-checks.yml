name: PR checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  conventional-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - name: Validate the PR title is a conventional commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # The squash-merge commit subject defaults to the PR title, which
          # release-please parses — so the title must be a conventional commit.
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9 ._/-]+\))?!?: .+'
          if printf '%s' "$TITLE" | grep -qE "$pattern"; then
            echo "OK: $TITLE"
          else
            echo "::error::PR title is not a conventional commit: '$TITLE'"
            echo "Expected: <type>[optional scope][!]: <description>"
            echo "types: feat fix docs style refactor perf test build ci chore revert"
            exit 1
          fi
