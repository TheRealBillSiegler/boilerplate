site_name: "Boilerplate Python Development Environment"
site_description: "An ethos made executable - developer guidance, project scaffolding, and best-practice reference for Python 3.12+."
# Required by mike (versioned deploys) and the docs version selector.
site_url: "https://therealbillsiegler.github.io/boilerplate/"
repo_url: "https://github.com/TheRealBillSiegler/boilerplate"
repo_name: boilerplate
docs_dir: docs

# Internal working docs (agent configuration) — not part of the public site.
exclude_docs: |
  agents/

# Built and linkable, but deliberately outside the nav: the intentions register
# is reached from the design corpus, and the container pages are a sequential
# journey entered via their section index.
not_in_nav: |
  intentions/README.md
  governance/migration-guide-template.md
  templates-hub/streamlit/deployment/containers/building-container-images.md
  templates-hub/streamlit/deployment/containers/environment-setup.md
  templates-hub/streamlit/deployment/containers/pushing-container-images.md

validation:
  anchors: warn

extra_css:
  - stylesheets/extra.css
  # The self-hosted asciinema-player (docs/assets/asciinema/, see NOTICE) is
  # loaded from docs/index.md itself, not here: it's a home-page-only widget,
  # and wiring it globally would ship it to all ~60 other pages that never
  # use it.

theme:
  name: material
  custom_dir: overrides
  # Self-hosted type (docs/assets/fonts/, wired via extra.css @font-face) —
  # no Google Fonts fetch at view time, and the offline bundle keeps working.
  font: false
  palette:
    # This entry has no `scheme:` — it's the auto/system toggle, not a
    # rendered scheme — but Material's base.html still reads `primary`/
    # `accent` off `palette | first` (this entry) to stamp the server-
    # rendered <body data-md-color-primary/accent> before any JS runs, so
    # they're set here too. Left unset, that first paint defaults to
    # Material's stock indigo and only snaps to custom once the inline
    # bootstrap script replays the saved scheme from localStorage.
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - navigation.path
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - search.highlight
    - search.suggest
  logo: assets/boilerplate.svg
  favicon: assets/boilerplate.svg
  icon:
    repo: fontawesome/brands/github
    status:
      planned: material/progress-clock

extra:
  # Hide the default "Made with Material for MkDocs" footer line
  generator: false
  # Un-versioned site root, for links that must survive a `mike deploy` build.
  # mike's injected mkdocs plugin rewrites config.site_url on every deploying
  # build to config.site_url + "<version>" (no trailing slash -- see
  # mike.mkdocs_plugin.MikePlugin.on_config), so a template that builds a
  # link from site_url renders "<site_url><version>latest/..." with the
  # version and "latest" run together. This key is never touched by mike;
  # always ends in a trailing slash. Used by overrides/404.html.
  site_root: "https://therealbillsiegler.github.io/boilerplate/"
  # Versioned docs via mike (one entry per MAJOR.MINOR; see RELEASING.md).
  # The header selector renders only where mike's versions.json is served —
  # deployed Pages, or `mike serve`. Plain builds and the offline bundle get
  # no selector (the file:// fetch fails silently), so both stay valid.
  version:
    provider: mike
    default: latest
    alias: true
  status:
    planned: Describes the target design; not yet implemented

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      # Resolve includes from repo root (e.g. LICENSE, SECURITY.md) and docs/
      base_path: [".", "docs"]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - mkdocs-typer

extra_javascript:
  # The asciinema-player script, its cast data, and assets/demo.js that
  # drives them are loaded from docs/index.md itself, not here — see the
  # extra_css comment above for why.
  # Zero trust theme integration (author-controlled diagrams only). Loaded on
  # every page, but it does nothing on one without a `.mermaid` element: only
  # then does it inject assets/mermaid.min.js itself (Mermaid 10.9.1, vendored
  # locally — byte-for-byte upstream's published build, with upstream's
  # LICENSE beside it), resolving that script's URL from its own
  # document.currentScript.src so it works at any page depth and from the
  # offline bundle. No external fetch at view time either way, and the
  # offline bundle still renders diagrams. When upgrading Mermaid, replace
  # docs/assets/mermaid.min.js byte-for-byte and refresh
  # docs/assets/mermaid.LICENSE from the upstream tag in the same change.
  - assets/mermaid-theme.js

plugins:
  - search
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            docstring_style: google
            show_root_full_path: false
            members_order: source
            filters: ["!^_"]
            # Trim the right-rail symbol TOC (was an overwhelming wall of names)
            show_root_toc_entry: false
            show_symbol_type_toc: false
  # Only for the downloadable release bundle (file:// support); off for the
  # online site so navigation.instant can be adopted once the site deploys to
  # Pages (the two are mutually exclusive). CI builds both configs.
  - offline:
      enabled: !ENV [DOCS_OFFLINE, false]
  - panzoom:
      full_screen: true

