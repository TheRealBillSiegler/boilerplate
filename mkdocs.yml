      - ADR-005 Integrity Model: design/adr-005-integrity-model.md
      - ADR-006 Template Distribution: design/adr-006-template-distribution.md
      - ADR-007 Update Model: design/adr-007-update-model.md
      - ADR-008 Distribution Name: design/adr-008-distribution-name.md
      - ADR-009 Environment Provider Protocol: design/adr-009-environment-provider-protocol.md
