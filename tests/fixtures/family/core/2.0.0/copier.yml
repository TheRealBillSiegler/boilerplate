_answers_file: .copier-answers.core.yml

# Copier's default exclusions, restated because a declared `_exclude` replaces
# them, plus the authoring metadata and the extension module.
_exclude:
  - "/copier.yaml"
  - "/copier.yml"
  - "/boilerplate.yml"
  - "~*"
  - "*.py[co]"
  - __pycache__
  - .git
  - .DS_Store
  - .svn
  - _extensions

_jinja_extensions:
  - copier_template_extensions.TemplateExtensionLoader
  - _extensions/naming.py:PackageNameExtension

# Project-owned: the project keeps its own history here, so a release never
# merges into the changelog once it exists.
_skip_if_exists:
  - "CHANGELOG.md"

# Run offline: each records that it ran by appending a line, the first a fixed
# one and the second the operation Copier runs the task under.
_tasks:
  - command:
      - "{{ _copier_python }}"
      - -c
      - "print('core task ran', file=open('.core-task-marker', 'a', encoding='utf-8'))"
  - command:
      - "{{ _copier_python }}"
      - -c
      - "print('{{ _copier_operation }}', file=open('.core-operation-marker', 'a', encoding='utf-8'))"

project_name:
  type: str
  help: "What is the (human-readable) name of the project?"
  default: "{{ _folder_name }}"

package_name:
  default: "{{ project_name | to_package }}"
  when: false

maintainer_name:
  type: str
  help: "Who maintains the project?"
  default: "Your Name"

python_version:
  type: str
  help: "Which Python version does the project target?"
  choices:
    - "3.11"
    - "3.12"
    - "3.13"
  default: "3.12"

use_tests:
  type: bool
  help: "Include a smoke test?"
  default: true

api_token:
  type: str
  help: "API token for the package index (kept out of the answers file)."
  secret: true
  default: ""

license:
  type: str
  help: "Which license does the project use?"
  choices:
    - MIT
    - Apache-2.0
    - "None"
  default: MIT

# A project recorded `author_name` before this release; the update would
# otherwise ask `maintainer_name` again and drop the recorded name.
_migrations:
  - version: "2.0.0"
    when: "{{ _stage == 'before' }}"
    command:
      - "{{ _copier_python }}"
      - -c
      - |
        import pathlib

        answers = pathlib.Path(".copier-answers.core.yml")
        if answers.exists():
            text = answers.read_text(encoding="utf-8")
            answers.write_text(
                text.replace("author_name:", "maintainer_name:"),
                encoding="utf-8",
                newline="\n",
            )
