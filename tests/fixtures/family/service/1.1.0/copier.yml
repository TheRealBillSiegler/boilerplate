_answers_file: .copier-answers.service.yml

# Copier's default exclusions, restated because a declared `_exclude` replaces
# them, plus the authoring metadata and the extension module.
_exclude:
  - "/copier.yaml"
  - "/copier.yml"
  - "/boilerplate.yml"
  - "~*"
  - "*.py[co]"
  - __pycache__
  - .git
  - .DS_Store
  - .svn
  - _extensions

_jinja_extensions:
  - copier_template_extensions.TemplateExtensionLoader
  - _extensions/runtime.py:RuntimeContext

# Overrides core's default Python version.
python_version:
  default: "3.13"

port:
  type: int
  help: "Which port does the service listen on?"
  default: 8000
  validator: >-
    {% if port < 1024 or port > 65535 %}Choose a port from 1024 to 65535.{% endif %}
