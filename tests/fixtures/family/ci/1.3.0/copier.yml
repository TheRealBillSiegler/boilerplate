_answers_file: .copier-answers.ci.yml

# Copier's default exclusions, restated because a declared `_exclude` replaces
# them, plus the authoring metadata.
_exclude:
  - "/copier.yaml"
  - "/copier.yml"
  - "/boilerplate.yml"
  - "~*"
  - "*.py[co]"
  - __pycache__
  - .git
  - .DS_Store
  - .svn

# Authoring defect, kept on purpose: `ci_hosted` is a bool, so reading an
# attribute of an attribute of it cannot render.
ci_hosted:
  type: bool
  help: "Does a hosted provider run the checks?"
  default: true

ci_provider:
  type: str
  help: "Which CI provider runs the checks?"
  when: "{{ ci_hosted.flag.kind }}"
  choices:
    - github
  default: github
